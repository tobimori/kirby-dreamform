name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-format:
    name: lint and format
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: install php dependencies
        run: composer install --no-interaction --prefer-dist

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: install pnpm
        uses: pnpm/action-setup@v3

      - name: install node dependencies
        run: pnpm install --frozen-lockfile

      - name: run eslint
        run: pnpm run lint

      - name: check prettier formatting
        run: pnpm exec prettier --check "src/**/*.{js,vue}"

      - name: run php cs fixer
        run: composer run cs:check

  static-analysis:
    name: static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: install php dependencies
        run: composer install --no-interaction --prefer-dist

      - name: run psalm
        run: composer run analyze -- --php-version=${{ matrix.php }}
